version: 2

updates:
  # The ALTCHA widget assets are vendored under django_altcha/static/altcha/,
  # but the version is pinned in package.json so that upgrades are proposed
  # here. After merging such an update, re-vendor the assets with:
  #     make sync-altcha
  # CI fails until the vendored files match the pinned version.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
