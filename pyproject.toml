[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-altcha-widget"
version = "1.0.0"
description = "Django form field and widget for the ALTCHA proof-of-work CAPTCHA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hervé Le Roy", email = "hleroy@hleroy.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2",
    "altcha>=2.1.0,<3.0.0",  # server-side challenge creation and verification
]
keywords = ["captcha", "django", "widget", "form", "altcha", "proof-of-work", "privacy"]

[project.optional-dependencies]
# Required to generate and verify ARGON2ID challenges.
argon2 = [
    "argon2-cffi",
]
dev = [
    "build",
    "ruff",
    "pytest-django",
    "argon2-cffi",
]

[project.urls]
Homepage = "https://github.com/hleroy/django-altcha"
Repository = "https://github.com/hleroy/django-altcha.git"
Issues = "https://github.com/hleroy/django-altcha/issues"
Changelog = "https://github.com/hleroy/django-altcha/blob/main/CHANGELOG.rst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_altcha_widget"]

[tool.setuptools.package-data]
django_altcha_widget = ["static/**", "templates/**"]

[tool.ruff.lint]
# Rules: https://docs.astral.sh/ruff/rules/
select = [
    "E",  # pycodestyle
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "UP", # pyupgrade
    "S",  # flake8-bandit
    "I",  # isort
    "C9", # McCabe complexity
]

[tool.ruff.lint.isort]
force-single-line = true
sections = { django = ["django"] }
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]
